<!DOCTYPE html>
<!-- Estructura de la página (fase 1). El estilo está en css/estilos.css (fase 2)
     y el comportamiento en js/app.js (fase 3). -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Hace que la página se adapte al ancho de la pantalla (móvil, portátil...) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo tecnológico</title>
  <!-- Enlace a la hoja de estilos (fase 2): el HTML dice QUÉ hay; el CSS, CÓMO se ve -->
  <link rel="stylesheet" href="css/estilos.css">
  <!-- Comportamiento (fase 3). "defer" hace que el script espere a que todo el HTML esté cargado,
       así puede encontrar el formulario y la tabla. -->
  <!-- config.js va ANTES que app.js: define a qué backend conectarse (local o Render).
       Los scripts con "defer" se ejecutan en el orden en que aparecen. -->
  <script src="js/config.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>

  <!-- Cabecera de la página -->
  <header>
    <h1>Catálogo tecnológico</h1>
    <p>Gestión de productos: crear, ver, editar y eliminar.</p>
  </header>

  <main>

    <!-- Zona de mensajes: vacía por ahora. En la fase 3, JavaScript escribirá aquí los avisos de éxito o error.
         role="status" indica a los lectores de pantalla que aquí aparecen avisos. -->
    <div id="mensajes" role="status"></div>

    <!-- Sección del formulario: sirve para crear y (en la fase 3) también para editar -->
    <section>
      <!-- El id permite que JavaScript cambie el título a "Editar producto" -->
      <h2 id="titulo-formulario">Nuevo producto</h2>

      <!-- Los atributos required, minlength, maxlength y min son validación del propio HTML:
           el navegador impide enviar el formulario si no se cumplen. -->
      <form id="formulario-producto">

        <!-- El "for" de cada <label> coincide con el "id" de su campo: así quedan enlazados -->
        <p>
          <label for="nombre">Nombre *</label><br>
          <input type="text" id="nombre" name="nombre" required minlength="2" maxlength="100">
        </p>

        <p>
          <label for="marca">Marca *</label><br>
          <input type="text" id="marca" name="marca" required minlength="2" maxlength="50">
        </p>

        <p>
          <label for="categoria">Categoría *</label><br>
          <!-- Lista cerrada: solo se puede elegir una de estas opciones.
               "value" es lo que se guarda (sin tildes); el texto es lo que se ve. -->
          <select id="categoria" name="categoria" required>
            <option value="">-- Elige una categoría --</option>
            <option value="portatil">Portátil</option>
            <option value="smartphone">Smartphone</option>
            <option value="tablet">Tablet</option>
            <option value="periferico">Periférico</option>
            <option value="audio">Audio</option>
            <option value="accesorio">Accesorio</option>
          </select>
        </p>

        <p>
          <label for="precio">Precio (€) *</label><br>
          <!-- step="0.01" permite hasta 2 decimales (céntimos) -->
          <input type="number" id="precio" name="precio" required min="0" step="0.01">
        </p>

        <p>
          <label for="stock">Stock (unidades) *</label><br>
          <!-- step="1" obliga a que sea un número entero -->
          <input type="number" id="stock" name="stock" required min="0" step="1">
        </p>

        <p>
          <label for="descripcion">Descripción (opcional)</label><br>
          <textarea id="descripcion" name="descripcion" maxlength="300" rows="3"></textarea>
        </p>

        <p>
          <!-- type="submit" envía el formulario; type="reset" vacía los campos -->
          <button type="submit" id="boton-guardar">Guardar</button>
          <button type="reset">Cancelar</button>
        </p>

        <p><small>* Campo obligatorio</small></p>
      </form>
    </section>

    <!-- Sección del listado -->
    <section>
      <h2>Productos</h2>

      <!-- Tabla: cada fila (<tr>) es un producto; cada celda (<td>) un dato -->
      <table>
        <!-- <thead>: fila de títulos de las columnas -->
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Marca</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Descripción</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <!-- <tbody>: los datos. Está VACÍO a propósito: las filas las genera JavaScript (js/app.js)
             a partir de los productos guardados en localStorage. -->
        <tbody id="lista-productos"></tbody>
      </table>
    </section>

  </main>

</body>
</html>
